# =======================================================
#           PlayerHeadShop Language File (English)
# =======================================================

messages:
  prefix: "<gray>[<gold>HeadShop</gold>]</gray> "
  success: "<green>You spent <gold><cost_amount> <cost_item></gold> and purchased <gold><head_amount> of your own head!</green>"
  vault-success: "<green>You spent <gold><cost_amount></gold> and purchased <gold><head_amount> of your own head!</green>"
  exp-level-success: "<green>You spent <gold><cost_amount></gold> and purchased <gold><head_amount> of your own head!</green>"
  exp-points-success: "<green>You spent <gold><cost_amount></gold> and purchased <gold><head_amount> of your own head!</green>"
  not-enough-items: "<red>Not enough items! Required: <gold><required> <item></gold>, you have: <gold><current></gold> (Missing <missing>).</red>"
  not-enough-money: "<red>Not enough money! Required: <gold><required></gold>, you have: <gold><current></gold> (Missing <missing>).</red>"
  not-enough-exp-level: "<red>Not enough experience levels! Required: <gold><required></gold>, you have: <gold><current></gold> (Missing <missing>).</red>"
  not-enough-exp-points: "<red>Not enough experience points! Required: <gold><required></gold>, you have: <gold><current></gold> (Missing <missing>).</red>"
  vault-disabled: "<red>Vault economy is not enabled on this server!</red>"
  inventory-full: "<yellow>Your inventory was full! Overflowing heads dropped at your feet.</yellow>"
  reload-success: "<green>PlayerHeadShop configuration and language files reloaded successfully!</green>"
  no-permission: "<red>You do not have permission to use this command!</red>"
  player-only: "<red>This command can only be executed by players in-game.</red>"

  # Trade History
  history-header: "<gold><bold>=== Trade History (Page <page>/<max_page>, Total <total>) ===</bold></gold>"
  history-player-header: "<gold><bold>=== Trade History for <player> (Page <page>/<max_page>, Total <total>) ===</bold></gold>"
  history-entry: "<gray>[<time>]</gray> <yellow><player></yellow> spent <aqua><cost_amount> <cost_item></aqua> for <gold><head_amount> heads</gold>"
  history-footer: "<gray>Tip: Use <yellow>/buyhead history [player] [page]</yellow> for more records</gray>"
  history-empty: "<red>No trade records found!</red>"
  history-invalid-page: "<red>Invalid page number! Valid range is 1 to <max_page>.</red>"

  # Treasury Pool & Audit Logs
  treasury-disabled: "<red>Treasury revenue pool is disabled (pool.enabled: false).</red>"
  treasury-empty-vault: "<red>There is currently no Vault money in the treasury!</red>"
  treasury-empty-exp: "<red>There is currently no experience points in the treasury!</red>"
  treasury-withdraw-vault-success: "<green>Successfully withdrew <gold><amount></gold> from treasury!</green>"
  treasury-withdraw-exp-success: "<green>Successfully withdrew <gold><amount></gold> from treasury!</green>"
  treasury-info-header: "<gold><bold>=== PlayerHeadShop Treasury Assets ===</bold></gold>"
  treasury-info-vault: "<white>Vault Balance: <gold><amount></gold></white>"
  treasury-info-exp: "<white>Exp Points: <green><amount></green></white>"
  treasury-info-items: "<white>Physical Stacks: <aqua><amount> item stacks</aqua></white>"
  treasury-logs-header: "<gold><bold>=== Treasury Admin Withdrawal Audit Logs (Page <page>/<max_page>, Total <total>) ===</bold></gold>"
  treasury-logs-entry: "<gray>[<time>]</gray> Admin <yellow><admin></yellow> withdrew <aqua><detail></aqua>"
  treasury-logs-empty: "<red>No treasury withdrawal audit records found!</red>"
  treasury-logs-invalid-page: "<red>Invalid page number! Valid range is 1 to <max_page>.</red>"

  # Community Market
  market-disabled: "<red>Community head market is disabled (market.enabled: false).</red>"
  market-max-listings: "<red>You have reached your maximum active listings limit (<max>)!</red>"
  market-publish-success: "<green>Successfully published head <gold><title></gold> (ID: <id>) to market!</green>"
  market-publish-failed: "<red>Failed to publish head, please try again later.</red>"
  market-unlist-success: "<green>Successfully unlisted head (ID: <id>)!</green>"
  market-unlist-failed: "<red>Failed to unlist head, item not found or you are not the owner.</red>"
  market-buy-success: "<green>Successfully purchased <gold><head_amount></gold> head(s) shared by <yellow><seller></yellow>!</green>"

gui:
  main-title: "<gradient:#FFAA00:#FF5555><bold>Player Head Shop</bold></gradient>"
  deposit-title: "<gradient:#FFAA00:#FF5555><bold>Deposit Items</bold></gradient> <gray>-</gray> <yellow><head_amount></yellow>"
  confirm-button:
    name: "<green><bold>▶ Click to Confirm</bold></green>"
    lore:
      - "<gray>Place required items in the left deposit slots:</gray>"
      - "<white>Cost: <aqua><cost_amount> <cost_item></aqua></white>"
      - "<white>Receive: <gold><head_amount> of your skin head</gold></white>"
      - ""
      - "<gray>(Supports multiple stacks for quantities over 64)</gray>"
      - ""
      - "<yellow>Click here once items are placed!</yellow>"
  vault-button:
    lore:
      - "<gray>Purchase heads with your skin."
      - ""
      - "<white>Receive: <gold><head_amount> of your skin head</gold></white>"
      - "<white>Cost: <gold><cost_amount></gold></white>"
      - ""
      - "<green>▶ Click to purchase instantly!</green>"
  exp-level-button:
    lore:
      - "<gray>Purchase heads with your skin."
      - ""
      - "<white>Receive: <gold><head_amount> of your skin head</gold></white>"
      - "<white>Cost: <green><cost_amount></green></white>"
      - ""
      - "<green>▶ Click to deduct levels and buy!</green>"
  exp-points-button:
    lore:
      - "<gray>Purchase heads with your skin."
      - ""
      - "<white>Receive: <gold><head_amount> of your skin head</gold></white>"
      - "<white>Cost: <green><cost_amount></green></white>"
      - ""
      - "<green>▶ Click to deduct exp points and buy!</green>"
  preview-head:
    name: "<gold><bold>Receive: <head_amount> Player Head(s)</bold></gold>"
    lore:
      - "<gray>Preview of the head you will receive.</gray>"
      - "<gray>Quantities over 64 are packaged into stacks.</gray>"
      - ""
      - "<green>Click here to confirm trade as well!</green>"
  back-button:
    name: "<red><bold>◀ Back</bold></red>"
    lore:
      - "<gray>Click to return to previous menu.</gray>"

  # Main Menu Market Entrance Button
  market-entrance:
    name: "<gradient:#FFAA00:#FF5555><bold>✦ Community Head Market</bold></gradient>"
    lore:
      - "<gray>Browse heads published by players across the server!</gray>"
      - "<gray>You can also share and list your own head.</gray>"
      - ""
      - "<green>▶ Click to open Head Market!</green>"

  # Treasury GUI
  treasury-title: "<gradient:#FFAA00:#FF5555><bold>Revenue Treasury</bold></gradient>"
  treasury-vault:
    name: "<gold><bold>[Wallet] Withdraw Vault Money</bold></gold>"
    lore:
      - "<gray>Current treasury balance:</gray>"
      - "<white>Balance: <gold><amount></gold></white>"
      - ""
      - "<green>▶ Click to withdraw full amount</green>"
  treasury-exp:
    name: "<green><bold>[Exp] Withdraw Experience</bold></green>"
    lore:
      - "<gray>Current treasury total experience:</gray>"
      - "<white>Experience: <green><amount></green></white>"
      - ""
      - "<green>▶ Click to absorb full experience</green>"
  treasury-logs:
    name: "<aqua><bold>[Logs] Withdrawal Audit Logs</bold></aqua>"
    lore:
      - "<gray>Click to view admin withdrawal logs in chat.</gray>"
  treasury-refresh:
    name: "<yellow><bold>🔄 Refresh Treasury</bold></yellow>"
    lore:
      - "<gray>Click to reload latest treasury assets.</gray>"

  # Community Market GUI
  market-title: "<gradient:#FFAA00:#FF5555><bold>Head Market</bold></gradient> <gray>(Page <page>)</gray>"
  market-my-title: "<gradient:#FFAA00:#FF5555><bold>My Listed Heads</bold></gradient>"
  market-head-lore:
    - "<gray>Seller: <yellow><seller></yellow></gray>"
    - "<gray>Listed: <white><date></white></gray>"
    - "<white>Receive: <gold><head_amount> head(s)</gold></white>"
    - "<white>Price: <aqua><price></aqua></white>"
    - "<gray>Total Sales: <white><sales></white></gray>"
  market-buy-hint: "<green>▶ Click to purchase!</green>"
  market-unlist-hint: "<red>▶ Click to unlist this head</red>"
  market-prev: "<yellow><bold>◀ Previous</bold></yellow>"
  market-next: "<yellow><bold>Next ▶</bold></yellow>"
  market-back-to-shop:
    name: "<yellow><bold>◀ Back to Shop</bold></yellow>"
    lore:
      - "<gray>Click to return to personal head shop.</gray>"
  market-share-btn:
    name: "<green><bold>+ Publish / List My Head</bold></green>"
    lore:
      - "<gray>Click to open the head publishing setup menu!</gray>"
  market-my-btn:
    name: "<aqua><bold>[List] My Listings</bold></aqua>"
    lore:
      - "<gray>Click to manage your active listings.</gray>"
  market-all-btn:
    name: "<gold><bold>[Market] All Market Listings</bold></gold>"
    lore:
      - "<gray>Click to return to the public marketplace.</gray>"

  # Publish GUI
  publish-title: "<gradient:#FFAA00:#FF5555><bold>Head Publishing Setup</bold></gradient>"
  publish-mode:
    name: "<gold><bold>Mode: <mode></bold></gold>"
    lore:
      - "<gray>Select the payment currency or item required from buyers.</gray>"
      - "<gray>Current: <white><mode></white></gray>"
      - ""
      - "<green>▶ Click to cycle payment mode</green>"
  publish-price:
    name: "<gold><bold>Price: <price></bold></gold>"
    lore:
      - "<gray>Current Price: <aqua><price></aqua></gray>"
      - ""
      - "<green>▶ Left Click: Open sign to enter custom price</green>"
      - "<yellow>▶ Right Click: +1 / Shift+Right Click: +10 / Shift+Left: -1</yellow>"
  publish-title-btn:
    name: "<aqua><bold>Custom Head Title</bold></aqua>"
    lore:
      - "<gray>Current: <white><title></white></gray>"
      - ""
      - "<green>▶ Click to open sign to enter custom title</green>"
  publish-preview:
    lore:
      - "<gray>Seller: <yellow><seller></yellow></gray>"
      - "<white>Item: <gold><head_amount> Player Head(s)</gold></white>"
      - "<white>Price: <aqua><price></aqua></white>"
      - ""
      - "<gray>This is how your listing will appear in the market.</gray>"
  publish-confirm:
    name: "<green><bold>✔ Confirm and Publish</bold></green>"
    lore:
      - "<gray>Confirm settings and publish your head to the market!</gray>"
      - ""
      - "<green>▶ Click to list immediately!</green>"

units:
  item: "<amount>x"
  stacks-exact: "<amount>x (<stacks> stacks)"
  stacks-rem: "<amount>x (<stacks> stacks + <rem>x)"
  exp-level: "<amount> Levels"
  exp-points: "<amount> Exp Points"

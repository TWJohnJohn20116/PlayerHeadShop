# =======================================================
#           PlayerHeadShop Language File (English)
# =======================================================

messages:
  prefix: "<gray>[<gold>HeadShop</gold>]</gray> "
  success: "<green>You spent <gold><cost_amount> <cost_item></gold> and received <gold><head_amount> of your own heads!</green>"
  vault-success: "<green>You spent <gold><cost_amount></gold> and received <gold><head_amount> of your own heads!</green>"
  exp-level-success: "<green>You spent <gold><cost_amount></gold> and received <gold><head_amount> of your own heads!</green>"
  exp-points-success: "<green>You spent <gold><cost_amount></gold> and received <gold><head_amount> of your own heads!</green>"
  not-enough-items: "<red>Not enough items! Required <gold><required> <item></gold>, you only have <gold><current></gold> (Missing <missing>).</red>"
  not-enough-money: "<red>Not enough money! Required <gold><required></gold>, you only have <gold><current></gold> (Missing <missing>).</red>"
  not-enough-exp-level: "<red>Not enough experience levels! Required <gold><required></gold>, you currently have <gold><current></gold> (Missing <missing>).</red>"
  not-enough-exp-points: "<red>Not enough experience points! Required <gold><required></gold>, you currently have <gold><current></gold> (Missing <missing>).</red>"
  vault-disabled: "<red>Vault economy system is not enabled on this server!</red>"
  inventory-full: "<yellow>Your inventory was full! Overflow heads have dropped at your feet.</yellow>"
  reload-success: "<green>PlayerHeadShop configuration and language files reloaded successfully!</green>"
  no-permission: "<red>You do not have permission to use this command!</red>"
  player-only: "<red>This command can only be used by in-game players.</red>"

  # Trade History
  history-header: "<gold><bold>=== Head Trade History (Page <page>/<max_page>, Total <total>) ===</bold></gold>"
  history-player-header: "<gold><bold>=== Trade History for <player> (Page <page>/<max_page>, Total <total>) ===</bold></gold>"
  history-entry: "<gray>[<time>]</gray> <yellow><player></yellow> spent <aqua><cost_amount> <cost_item></aqua> for <gold><head_amount> Head(s)</gold>"
  history-footer: "<gray>Tip: Type <yellow>/buyhead history [player] [page]</yellow> for more</gray>"
  history-empty: "<red>No trade records found!</red>"
  history-invalid-page: "<red>Invalid page number! Valid range is 1 ~ <max_page>.</red>"

gui:
  main-title: "<gradient:#FFAA00:#FF5555><bold>Player Head Shop</bold></gradient>"
  deposit-title: "<gradient:#FFAA00:#FF5555><bold>Deposit & Trade</bold></gradient> <gray>-</gray> <yellow><head_amount></yellow>"
  confirm-button:
    name: "<green><bold>▶ Click to Confirm Exchange</bold></green>"
    lore:
      - "<gray>Please place required items in the left slots:</gray>"
      - "<white>Cost: <aqua><cost_amount> <cost_item></aqua></white>"
      - "<white>Receive: <gold><head_amount> of your own head(s)</gold></white>"
      - ""
      - "<gray>(Multi-slot deposit supported for quantities > 64)</gray>"
      - ""
      - "<yellow>Click here once items are placed to complete purchase!</yellow>"
  vault-button:
    lore:
      - "<gray>Purchase a head with your own skin."
      - ""
      - "<white>Receive: <gold><head_amount> of your own head(s)</gold></white>"
      - "<white>Cost: <gold><cost_amount></gold></white>"
      - ""
      - "<green>▶ Click to purchase instantly!</green>"
  exp-level-button:
    lore:
      - "<gray>Purchase a head with your own skin."
      - ""
      - "<white>Receive: <gold><head_amount> of your own head(s)</gold></white>"
      - "<white>Cost: <green><cost_amount></green></white>"
      - ""
      - "<green>▶ Click to purchase with levels!</green>"
  exp-points-button:
    lore:
      - "<gray>Purchase a head with your own skin."
      - ""
      - "<white>Receive: <gold><head_amount> of your own head(s)</gold></white>"
      - "<white>Cost: <green><cost_amount></green></white>"
      - ""
      - "<green>▶ Click to purchase with exp points!</green>"
  preview-head:
    name: "<gold><bold>Receive: <head_amount> Head(s)</bold></gold>"
    lore:
      - "<gray>Preview of the player head with your skin.</gray>"
      - "<gray>Amounts exceeding 64 are automatically bundled in stacks.</gray>"
      - ""
      - "<green>Clicking here also confirms the exchange!</green>"
  back-button:
    name: "<red><bold>◀ Back to Shop Menu</bold></red>"
    lore:
      - "<gray>Return to main menu. Unused items will be returned to your inventory.</gray>"

units:
  item: "<amount>x"
  stacks-exact: "<amount>x (<stacks> stacks)"
  stacks-rem: "<amount>x (<stacks> stacks + <rem> items)"
  exp-level: "<amount> Level(s)"
  exp-points: "<amount> Exp Point(s)"

# =======================================================
#           PlayerHeadShop 語言檔 (繁體中文)
# =======================================================

messages:
  prefix: "<gray>[<gold>HeadShop</gold>]</gray> "
  success: "<green>你花費了 <gold><cost_amount> <cost_item></gold> 購買了 <gold><head_amount> 自己的頭顱！</green>"
  vault-success: "<green>你花費了 <gold><cost_amount></gold> 購買了 <gold><head_amount> 自己的頭顱！</green>"
  exp-level-success: "<green>你消耗了 <gold><cost_amount></gold> 購買了 <gold><head_amount> 自己的頭顱！</green>"
  exp-points-success: "<green>你消耗了 <gold><cost_amount></gold> 購買了 <gold><head_amount> 自己的頭顱！</green>"
  not-enough-items: "<red>物品不足！需要 <gold><required> <item></gold>，你目前只有 <gold><current></gold>（缺少 <missing>）。</red>"
  not-enough-money: "<red>金幣不足！需要 <gold><required></gold>，你目前只有 <gold><current></gold>（缺少 <missing>）。</red>"
  not-enough-exp-level: "<red>經驗等級不足！需要 <gold><required></gold>，你目前只有 <gold><current></gold>（缺少 <missing>）。</red>"
  not-enough-exp-points: "<red>經驗點數不足！需要 <gold><required></gold>，你目前只有 <gold><current></gold>（缺少 <missing>）。</red>"
  vault-disabled: "<red>伺服器未啟用 Vault 經濟系統，無法使用貨幣購買！</red>"
  inventory-full: "<yellow>你的背包已滿，溢出的頭顱已掉落在你的腳下！</yellow>"
  reload-success: "<green>PlayerHeadShop 設定檔與語言檔已成功重新加載！</green>"
  no-permission: "<red>你沒有權限使用此指令！</red>"
  player-only: "<red>此指令僅限遊戲內玩家使用。</red>"

  # 兌換歷史記錄
  history-header: "<gold><bold>=== 頭顱兌換記錄 (第 <page>/<max_page> 頁，共 <total> 筆) ===</bold></gold>"
  history-player-header: "<gold><bold>=== <player> 的兌換記錄 (第 <page>/<max_page> 頁，共 <total> 筆) ===</bold></gold>"
  history-entry: "<gray>[<time>]</gray> <yellow><player></yellow> 花費 <aqua><cost_amount> <cost_item></aqua> 兌換了 <gold><head_amount> 頭顱</gold>"
  history-footer: "<gray>提示: 輸入 <yellow>/buyhead history [玩家] [頁碼]</yellow> 查看更多記錄</gray>"
  history-empty: "<red>目前查無任何兌換記錄！</red>"
  history-invalid-page: "<red>無效的頁碼！有效頁碼為 1 ~ <max_page>。</red>"

  # 收益金庫與稽核日誌
  treasury-disabled: "<red>收益金庫功能未啟用 (pool.enabled: false)。</red>"
  treasury-empty-vault: "<red>目前金庫內沒有任何可提領的 Vault 金幣！</red>"
  treasury-empty-exp: "<red>目前金庫內沒有任何可提領的經驗值！</red>"
  treasury-withdraw-vault-success: "<green>成功從收益金庫提領了 <gold><amount></gold> 金幣！</green>"
  treasury-withdraw-exp-success: "<green>成功從收益金庫提領了 <gold><amount></gold>！</green>"
  treasury-info-header: "<gold><bold>=== PlayerHeadShop 收益金庫資產狀況 ===</bold></gold>"
  treasury-info-vault: "<white>金庫金幣餘額: <gold><amount></gold></white>"
  treasury-info-exp: "<white>金庫累積經驗: <green><amount></green></white>"
  treasury-info-items: "<white>金庫實體物品: <aqua><amount> 種物品堆疊</aqua></white>"
  treasury-logs-header: "<gold><bold>=== 金庫管理員提領稽核日誌 (第 <page>/<max_page> 頁，共 <total> 筆) ===</bold></gold>"
  treasury-logs-entry: "<gray>[<time>]</gray> 管理員 <yellow><admin></yellow> 提領了 <aqua><detail></aqua>"
  treasury-logs-empty: "<red>目前查無任何金庫提領稽核記錄！</red>"
  treasury-logs-invalid-page: "<red>無效的頁碼！有效頁碼為 1 ~ <max_page>。</red>"

  # 社群市集訊息
  market-disabled: "<red>社群頭顱市集功能未啟用 (market.enabled: false)。</red>"
  market-max-listings: "<red>你已達到個人最大上架數量上限 (<max> 個)！</red>"
  market-publish-success: "<green>成功上架頭顱 <gold><title></gold> (ID: <id>) 至社群市集！</green>"
  market-publish-failed: "<red>上架頭顱失敗，請稍後再試。</red>"
  market-unlist-success: "<green>成功下架頭顱 (ID: <id>)！</green>"
  market-unlist-failed: "<red>下架頭顱失敗，查無此項目或你非該商品擁有者。</red>"
  market-buy-success: "<green>成功購買了由 <yellow><seller></yellow> 分享的 <gold><head_amount></gold> 頭顱！</green>"

gui:
  main-title: "<gradient:#FFAA00:#FF5555><bold>自訂頭顱商店</bold></gradient>"
  deposit-title: "<gradient:#FFAA00:#FF5555><bold>放置物品兌換</bold></gradient> <gray>-</gray> <yellow><head_amount></yellow>"
  confirm-button:
    name: "<green><bold>▶ 點擊確認兌換</bold></green>"
    lore:
      - "<gray>請在左側放置區放入所需物品：</gray>"
      - "<white>需求: <aqua><cost_amount> <cost_item></aqua></white>"
      - "<white>獲得: <gold><head_amount> 你的個人頭顱</gold></white>"
      - ""
      - "<gray>(放置區支援放置多組物品，超過 64 個可分格放置)</gray>"
      - ""
      - "<yellow>放好後點擊此處即可完成購買！</yellow>"
  vault-button:
    lore:
      - "<gray>購買印有自身皮膚外觀的頭顱。"
      - ""
      - "<white>獲得: <gold><head_amount> 你的個人頭顱</gold></white>"
      - "<white>花費: <gold><cost_amount></gold></white>"
      - ""
      - "<green>▶ 點擊立即扣款購買！</green>"
  exp-level-button:
    lore:
      - "<gray>購買印有自身皮膚外觀的頭顱。"
      - ""
      - "<white>獲得: <gold><head_amount> 你的個人頭顱</gold></white>"
      - "<white>消耗: <green><cost_amount></green></white>"
      - ""
      - "<green>▶ 點擊立即扣除等級購買！</green>"
  exp-points-button:
    lore:
      - "<gray>購買印有自身皮膚外觀的頭顱。"
      - ""
      - "<white>獲得: <gold><head_amount> 你的個人頭顱</gold></white>"
      - "<white>消耗: <green><cost_amount></green></white>"
      - ""
      - "<green>▶ 點擊立即扣除經驗點數購買！</green>"
  preview-head:
    name: "<gold><bold>獲得: <head_amount> 個人頭顱</bold></gold>"
    lore:
      - "<gray>這是你即將獲得的皮膚外觀頭顱預覽。</gray>"
      - "<gray>數量超過 64 個時將自動為您分組打包。</gray>"
      - ""
      - "<green>點擊此處亦可確認兌換！</green>"
  back-button:
    name: "<red><bold>◀ 返回</bold></red>"
    lore:
      - "<gray>點擊返回上一頁選單。</gray>"

  # 商店主選單中的市集入口按鈕
  market-entrance:
    name: "<gradient:#FFAA00:#FF5555><bold>✦ 前往社群頭顱市集</bold></gradient>"
    lore:
      - "<gray>瀏覽全服其他玩家上架分享的自訂頭顱！</gray>"
      - "<gray>你也可以隨時上架自己的頭顱供大家購買。</gray>"
      - ""
      - "<green>▶ 點擊開啟社群市集！</green>"

  # 收益金庫 GUI
  treasury-title: "<gradient:#FFAA00:#FF5555><bold>收益金庫管理</bold></gradient>"
  treasury-vault:
    name: "<gold><bold>[錢包] 提領 Vault 金幣</bold></gold>"
    lore:
      - "<gray>目前金庫累積金幣總額：</gray>"
      - "<white>餘額: <gold><amount></gold></white>"
      - ""
      - "<green>▶ 點擊全額提領至個人錢包</green>"
  treasury-exp:
    name: "<green><bold>[經驗] 提領經驗值</bold></green>"
    lore:
      - "<gray>目前金庫累積經驗總點數：</gray>"
      - "<white>經驗: <green><amount></green></white>"
      - ""
      - "<green>▶ 點擊全額吸收至個人經驗條</green>"
  treasury-logs:
    name: "<aqua><bold>[日誌] 提領稽核日誌</bold></aqua>"
    lore:
      - "<gray>點擊在聊天室查看管理員提領記錄。</gray>"
  treasury-refresh:
    name: "<yellow><bold>🔄 重新整理金庫</bold></yellow>"
    lore:
      - "<gray>點擊重新載入最新的金庫物品與資產。</gray>"

  # 社群市集 GUI
  market-title: "<gradient:#FFAA00:#FF5555><bold>社群頭顱市集</bold></gradient> <gray>(第 <page> 頁)</gray>"
  market-my-title: "<gradient:#FFAA00:#FF5555><bold>我的上架頭顱管理</bold></gradient>"
  market-head-lore:
    - "<gray>上架者: <yellow><seller></yellow></gray>"
    - "<gray>上架時間: <white><date></white></gray>"
    - "<white>獲得: <gold><head_amount> 頭顱</gold></white>"
    - "<white>售價: <aqua><price></aqua></white>"
    - "<gray>累積銷量: <white><sales></white></gray>"
  market-buy-hint: "<green>▶ 點擊立即購買！</green>"
  market-unlist-hint: "<red>▶ 點擊將此頭顱下架</red>"
  market-prev: "<yellow><bold>◀ 上一頁</bold></yellow>"
  market-next: "<yellow><bold>下一頁 ▶</bold></yellow>"
  market-back-to-shop:
    name: "<yellow><bold>◀ 返回個人頭顱商店</bold></yellow>"
    lore:
      - "<gray>點擊返回個人皮膚頭顱購買選單。</gray>"
  market-share-btn:
    name: "<green><bold>+ 發布/上架我的頭顱</bold></green>"
    lore:
      - "<gray>點擊開啟自訂上架設定選單！</gray>"
  market-my-btn:
    name: "<aqua><bold>[清單] 我的上架管理</bold></aqua>"
    lore:
      - "<gray>點擊查看與管理自己發布的所有頭顱。</gray>"
  market-all-btn:
    name: "<gold><bold>[市集] 返回全部市集</bold></gold>"
    lore:
      - "<gray>點擊返回全服社群頭顱大廳。</gray>"

  # 頭顱上架設定 GUI
  publish-title: "<gradient:#FFAA00:#FF5555><bold>頭顱上架設定</bold></gradient>"
  publish-mode:
    name: "<gold><bold>模式: <mode></bold></gold>"
    lore:
      - "<gray>選擇買家購買你的頭顱時需支付的貨幣/物品。</gray>"
      - "<gray>目前模式: <white><mode></white></gray>"
      - ""
      - "<green>▶ 點擊循環切換支付模式</green>"
  publish-price:
    name: "<gold><bold>售價: <price></bold></gold>"
    lore:
      - "<gray>目前設定售價: <aqua><price></aqua></gray>"
      - ""
      - "<green>▶ 左鍵點擊: 開啟告示牌輸入自訂金額</green>"
      - "<yellow>▶ 右鍵點擊: +1 / Shift+右鍵: +10 / Shift+左鍵: -1</yellow>"
  publish-title-btn:
    name: "<aqua><bold>自訂頭顱名稱</bold></aqua>"
    lore:
      - "<gray>目前名稱: <white><title></white></gray>"
      - ""
      - "<green>▶ 點擊開啟告示牌輸入自訂名稱</green>"
  publish-preview:
    lore:
      - "<gray>賣家: <yellow><seller></yellow></gray>"
      - "<white>商品: <gold><head_amount> 個人頭顱</gold></white>"
      - "<white>售價: <aqua><price></aqua></white>"
      - ""
      - "<gray>這是上架後在社群市集中呈現的樣貌。</gray>"
  publish-confirm:
    name: "<green><bold>✔ 確認發布上架</bold></green>"
    lore:
      - "<gray>確認以上設定並將此頭顱發布至社群市集！</gray>"
      - ""
      - "<green>▶ 點擊立即上架！</green>"

units:
  item: "<amount> 個"
  stacks-exact: "<amount> 個 (<stacks> 組)"
  stacks-rem: "<amount> 個 (<stacks> 組 + <rem> 個)"
  exp-level: "<amount> 等級"
  exp-points: "<amount> 點經驗"

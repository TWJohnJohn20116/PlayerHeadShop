# =======================================================
#           PlayerHeadShop 语言文件 (简体中文)
# =======================================================

messages:
  prefix: "<gray>[<gold>HeadShop</gold>]</gray> "
  success: "<green>你花费了 <gold><cost_amount> <cost_item></gold> 购买了 <gold><head_amount> 自己的头颅！</green>"
  vault-success: "<green>你花费了 <gold><cost_amount></gold> 购买了 <gold><head_amount> 自己的头颅！</green>"
  exp-level-success: "<green>你消耗了 <gold><cost_amount></gold> 购买了 <gold><head_amount> 自己的头颅！</green>"
  exp-points-success: "<green>你消耗了 <gold><cost_amount></gold> 购买了 <gold><head_amount> 自己的头颅！</green>"
  not-enough-items: "<red>物品不足！需要 <gold><required> <item></gold>，你目前只有 <gold><current></gold>（缺少 <missing>）。</red>"
  not-enough-money: "<red>金币不足！需要 <gold><required></gold>，你目前只有 <gold><current></gold>（缺少 <missing>）。</red>"
  not-enough-exp-level: "<red>经验等级不足！需要 <gold><required></gold>，你目前只有 <gold><current></gold>（缺少 <missing>）。</red>"
  not-enough-exp-points: "<red>经验点数不足！需要 <gold><required></gold>，你目前只有 <gold><current></gold>（缺少 <missing>）。</red>"
  vault-disabled: "<red>服务器未启用 Vault 经济系统，无法使用货币购买！</red>"
  inventory-full: "<yellow>你的背包已满，溢出的头颅已掉落在你的脚下！</yellow>"
  reload-success: "<green>PlayerHeadShop 配置文件与语言文件已成功重新加载！</green>"
  no-permission: "<red>你没有权限使用此指令！</red>"
  player-only: "<red>此指令仅限游戏内玩家使用。</red>"

  # 兑换历史记录
  history-header: "<gold><bold>=== 头颅兑换记录 (第 <page>/<max_page> 页，共 <total> 条) ===</bold></gold>"
  history-player-header: "<gold><bold>=== <player> 的兑换记录 (第 <page>/<max_page> 页，共 <total> 条) ===</bold></gold>"
  history-entry: "<gray>[<time>]</gray> <yellow><player></yellow> 花费 <aqua><cost_amount> <cost_item></aqua> 兑换了 <gold><head_amount> 头颅</gold>"
  history-footer: "<gray>提示: 输入 <yellow>/buyhead history [玩家] [页码]</yellow> 查看更多记录</gray>"
  history-empty: "<red>目前查无任何兑换记录！</red>"
  history-invalid-page: "<red>无效的页码！有效页码为 1 ~ <max_page>。</red>"

  # 收益金库与审计日志
  treasury-disabled: "<red>收益金库功能未启用 (pool.enabled: false)。</red>"
  treasury-empty-vault: "<red>目前金库内没有任何可提领的 Vault 金币！</red>"
  treasury-empty-exp: "<red>目前金库内没有任何可提领的经验值！</red>"
  treasury-withdraw-vault-success: "<green>成功从收益金库提领了 <gold><amount></gold> 金币！</green>"
  treasury-withdraw-exp-success: "<green>成功从收益金库提领了 <gold><amount></gold>！</green>"
  treasury-info-header: "<gold><bold>=== PlayerHeadShop 收益金库资产状况 ===</bold></gold>"
  treasury-info-vault: "<white>金库金币余额: <gold><amount></gold></white>"
  treasury-info-exp: "<white>金库累积经验: <green><amount></green></white>"
  treasury-info-items: "<white>金库实体物品: <aqua><amount> 种物品堆叠</aqua></white>"
  treasury-logs-header: "<gold><bold>=== 金库管理员提领审计日志 (第 <page>/<max_page> 页，共 <total> 条) ===</bold></gold>"
  treasury-logs-entry: "<gray>[<time>]</gray> 管理员 <yellow><admin></yellow> 提领了 <aqua><detail></aqua>"
  treasury-logs-empty: "<red>目前查无任何金库提领审计记录！</red>"
  treasury-logs-invalid-page: "<red>无效的页码！有效页码为 1 ~ <max_page>。</red>"

  # 社区市集消息
  market-disabled: "<red>社区头颅市集功能未启用 (market.enabled: false)。</red>"
  market-max-listings: "<red>你已达到个人最大上架数量上限 (<max> 个)！</red>"
  market-publish-success: "<green>成功上架头颅 <gold><title></gold> (ID: <id>) 至社区市集！</green>"
  market-publish-failed: "<red>上架头颅失败，请稍后再试。</red>"
  market-unlist-success: "<green>成功下架头颅 (ID: <id>)！</green>"
  market-unlist-failed: "<red>下架头颅失败，查无此项目或你非该商品拥有者。</red>"
  market-buy-success: "<green>成功购买了由 <yellow><seller></yellow> 分享的 <gold><head_amount></gold> 头颅！</green>"

gui:
  main-title: "<gradient:#FFAA00:#FF5555><bold>自定义头颅商店</bold></gradient>"
  deposit-title: "<gradient:#FFAA00:#FF5555><bold>放置物品兑换</bold></gradient> <gray>-</gray> <yellow><head_amount></yellow>"
  confirm-button:
    name: "<green><bold>▶ 点击确认兑换</bold></green>"
    lore:
      - "<gray>请在左侧放置区放入所需物品：</gray>"
      - "<white>需求: <aqua><cost_amount> <cost_item></aqua></white>"
      - "<white>获得: <gold><head_amount> 你的个人头颅</gold></white>"
      - ""
      - "<gray>(放置区支持放置多组物品，超过 64 个可分格放置)</gray>"
      - ""
      - "<yellow>放好后点击此处即可完成购买！</yellow>"
  vault-button:
    lore:
      - "<gray>购买印有自身皮肤外观的头颅。"
      - ""
      - "<white>获得: <gold><head_amount> 你的个人头颅</gold></white>"
      - "<white>花费: <gold><cost_amount></gold></white>"
      - ""
      - "<green>▶ 点击立即扣款购买！</green>"
  exp-level-button:
    lore:
      - "<gray>购买印有自身皮肤外观的头颅。"
      - ""
      - "<white>获得: <gold><head_amount> 你的个人头颅</gold></white>"
      - "<white>消耗: <green><cost_amount></green></white>"
      - ""
      - "<green>▶ 点击立即扣除等级购买！</green>"
  exp-points-button:
    lore:
      - "<gray>购买印有自身皮肤外观的头颅。"
      - ""
      - "<white>获得: <gold><head_amount> 你的个人头颅</gold></white>"
      - "<white>消耗: <green><cost_amount></green></white>"
      - ""
      - "<green>▶ 点击立即扣除经验点数购买！</green>"
  preview-head:
    name: "<gold><bold>获得: <head_amount> 个人头颅</bold></gold>"
    lore:
      - "<gray>这是你即将获得的皮肤外观头颅预览。</gray>"
      - "<gray>数量超过 64 个时将自动为您分组打包。</gray>"
      - ""
      - "<green>点击此处亦可确认兑换！</green>"
  back-button:
    name: "<red><bold>◀ 返回</bold></red>"
    lore:
      - "<gray>点击返回上一页菜单。</gray>"

  # 商店主菜单中的市集入口按钮
  market-entrance:
    name: "<gradient:#FFAA00:#FF5555><bold>✦ 前往社区头颅市集</bold></gradient>"
    lore:
      - "<gray>浏览全服其他玩家上架分享的自定义头颅！</gray>"
      - "<gray>你也可以随时上架自己的头颅供大家购买。</gray>"
      - ""
      - "<green>▶ 点击开启社区市集！</green>"

  # 收益金库 GUI
  treasury-title: "<gradient:#FFAA00:#FF5555><bold>收益金库管理</bold></gradient>"
  treasury-vault:
    name: "<gold><bold>[钱包] 提领 Vault 金币</bold></gold>"
    lore:
      - "<gray>目前金库累积金币总额：</gray>"
      - "<white>余额: <gold><amount></gold></white>"
      - ""
      - "<green>▶ 点击全额提领至个人钱包</green>"
  treasury-exp:
    name: "<green><bold>[经验] 提领经验值</bold></green>"
    lore:
      - "<gray>目前金库累积经验总点数：</gray>"
      - "<white>经验: <green><amount></green></white>"
      - ""
      - "<green>▶ 点击全额吸收至个人经验条</green>"
  treasury-logs:
    name: "<aqua><bold>[日志] 提领审计日志</bold></aqua>"
    lore:
      - "<gray>点击在聊天室查看管理员提领记录。</gray>"
  treasury-refresh:
    name: "<yellow><bold>🔄 重新整理金库</bold></yellow>"
    lore:
      - "<gray>点击重新载入最新的金库物品与资产。</gray>"

  # 社区市集 GUI
  market-title: "<gradient:#FFAA00:#FF5555><bold>社区头颅市集</bold></gradient> <gray>(第 <page> 页)</gray>"
  market-my-title: "<gradient:#FFAA00:#FF5555><bold>我的上架头颅管理</bold></gradient>"
  market-head-lore:
    - "<gray>上架者: <yellow><seller></yellow></gray>"
    - "<gray>上架时间: <white><date></white></gray>"
    - "<white>获得: <gold><head_amount> 头颅</gold></white>"
    - "<white>售价: <aqua><price></aqua></white>"
    - "<gray>累积销量: <white><sales></white></gray>"
  market-buy-hint: "<green>▶ 点击立即购买！</green>"
  market-unlist-hint: "<red>▶ 点击将此头颅下架</red>"
  market-prev: "<yellow><bold>◀ 上一页</bold></yellow>"
  market-next: "<yellow><bold>下一页 ▶</bold></yellow>"
  market-back-to-shop:
    name: "<yellow><bold>◀ 返回个人头颅商店</bold></yellow>"
    lore:
      - "<gray>点击返回个人皮肤头颅购买菜单。</gray>"
  market-share-btn:
    name: "<green><bold>+ 发布/上架我的头颅</bold></green>"
    lore:
      - "<gray>点击开启自定义上架设置菜单！</gray>"
  market-my-btn:
    name: "<aqua><bold>[清单] 我的上架管理</bold></aqua>"
    lore:
      - "<gray>点击查看与管理自己发布的所有头颅。</gray>"
  market-all-btn:
    name: "<gold><bold>[市集] 返回全部市集</bold></gold>"
    lore:
      - "<gray>点击返回全服社区头颅大厅。</gray>"

  # 头颅上架设置 GUI
  publish-title: "<gradient:#FFAA00:#FF5555><bold>头颅上架设置</bold></gradient>"
  publish-mode:
    name: "<gold><bold>模式: <mode></bold></gold>"
    lore:
      - "<gray>选择买家购买你的头颅时需支付的货币/物品。</gray>"
      - "<gray>目前模式: <white><mode></white></gray>"
      - ""
      - "<green>▶ 点击循环切换支付模式</green>"
  publish-price:
    name: "<gold><bold>售价: <price></bold></gold>"
    lore:
      - "<gray>目前设定售价: <aqua><price></aqua></gray>"
      - ""
      - "<green>▶ 左键点击: 开启告示牌输入自定义金额</green>"
      - "<yellow>▶ 右键点击: +1 / Shift+右键: +10 / Shift+左键: -1</yellow>"
  publish-title-btn:
    name: "<aqua><bold>自定义头颅名称</bold></aqua>"
    lore:
      - "<gray>目前名称: <white><title></white></gray>"
      - ""
      - "<green>▶ 点击开启告示牌输入自定义名称</green>"
  publish-preview:
    lore:
      - "<gray>卖家: <yellow><seller></yellow></gray>"
      - "<white>商品: <gold><head_amount> 个人头颅</gold></white>"
      - "<white>售价: <aqua><price></aqua></white>"
      - ""
      - "<gray>这是上架后在社区市集中呈现的样貌。</gray>"
  publish-confirm:
    name: "<green><bold>✔ 确认发布上架</bold></green>"
    lore:
      - "<gray>确认以上设定并将此头颅发布至社区市集！</gray>"
      - ""
      - "<green>▶ 点击立即上架！</green>"

units:
  item: "<amount> 个"
  stacks-exact: "<amount> 个 (<stacks> 组)"
  stacks-rem: "<amount> 个 (<stacks> 组 + <rem> 个)"
  exp-level: "<amount> 等级"
  exp-points: "<amount> 点经验"

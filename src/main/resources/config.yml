# =======================================================
#               PlayerHeadShop 插件設定檔
# =======================================================

# 語言設定 (Language)
# 可選值:
#   "auto"  - 根據每位玩家的 Minecraft 客戶端語言自動切換 (繁中 / 簡中 / 英文)
#   "zh_TW" - 強制全服使用 繁體中文
#   "zh_CN" - 强制全服使用 简体中文
#   "en_US" - Force English
language: "auto"

# GUI 箱子介面設定
gui:
  rows: 3
  filler:
    enabled: true
    material: "GRAY_STAINED_GLASS_PANE"
    display-name: " "

# 多種兌換方案清單
# slot: 箱子格子編號 (0 ~ 53，例如 3 行介面為 0 ~ 26)
# cost-item: 消耗物品 (有效 Bukkit Material 名稱，如 DIAMOND, EMERALD, GOLD_INGOT, NETHERITE_INGOT 等)
# cost-amount: 消耗數量 (支援任意數量，大於 64 可在放置區分格放置)
# head-amount: 獲得頭顱數量 (支援任意數量，大於 64 自動分組堆疊發放)
options:
  - slot: 11
    cost-item: "DIAMOND"
    cost-amount: 1
    head-amount: 1

  - slot: 13
    cost-item: "DIAMOND"
    cost-amount: 7
    head-amount: 8

  - slot: 15
    cost-item: "DIAMOND"
    cost-amount: 50
    head-amount: 64

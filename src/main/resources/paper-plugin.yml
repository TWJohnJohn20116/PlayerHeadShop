name: PlayerHeadShop
version: '1.0.0'
main: com.twjo.playerheadshop.PlayerHeadShop
api-version: '1.21'
folia-supported: true
description: A lightweight Paper/Folia Minecraft plugin to purchase player heads with custom items.
author: TW_Jo

permissions:
  playerheadshop.use:
    description: 允許玩家使用 /buyhead 購買自己的頭顱
    default: true
  playerheadshop.admin:
    description: 允許管理員重新加載 PlayerHeadShop 設定檔
    default: op
